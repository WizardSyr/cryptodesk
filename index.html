<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CryptoDesk">
    <title>CryptoDesk Pro - Live Watchlist & Market Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #090b10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 14px 34px 14px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Trading Terminal Header */
        .terminal-header {
            width: 100%;
            max-width: 740px;
            background: #0f131c;
            border: 1px solid #1c2436;
            border-radius: 18px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        /* Clock & Date Block */
        .clock-block {
            display: flex;
            flex-direction: column;
        }
        .clock-time-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .clock-time {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .clock-sec {
            font-size: 18px;
            font-weight: 700;
            color: #f0b90b;
        }
        .clock-ampm {
            font-size: 13px;
            font-weight: 700;
            color: #848e9c;
            margin-left: 4px;
        }
        .clock-date {
            font-size: 11px;
            font-weight: 700;
            color: #848e9c;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Market Sessions Block */
        .sessions-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .sessions-label {
            font-size: 10px;
            font-weight: 700;
            color: #58667e;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .sessions-tags {
            display: flex;
            gap: 6px;
        }
        .session-badge {
            background: #141924;
            border: 1px solid #20283a;
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #848e9c;
        }
        .session-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #58667e;
        }
        .session-badge.open {
            background: rgba(14, 203, 129, 0.12);
            border-color: rgba(14, 203, 129, 0.35);
            color: #0ecb81;
        }
        .session-badge.open .dot {
            background: #0ecb81;
            box-shadow: 0 0 8px #0ecb81;
        }

        /* Fear & Greed Block */
        .fng-block {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #141924;
            border: 1px solid #20283a;
            border-radius: 12px;
            padding: 6px 14px;
        }
        .fng-score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fng-number {
            font-size: 22px;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: #f6465d;
        }
        .fng-sub {
            font-size: 9px;
            color: #58667e;
            font-weight: 700;
        }
        .fng-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .fng-title {
            font-size: 10px;
            font-weight: 700;
            color: #848e9c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .fng-label-val {
            font-size: 13px;
            font-weight: 800;
            color: #f6465d;
            letter-spacing: 0.2px;
        }
        .fng-meter-bg {
            width: 90px;
            height: 4px;
            background: #252e42;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }
        .fng-meter-fill {
            height: 100%;
            width: 11%;
            background: #f6465d;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* Header Action Buttons */
        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .action-btn {
            background: #151a26;
            border: 1px solid #242e42;
            color: #eaecef;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .action-btn.active {
            background: #f0b90b;
            color: #000;
            border-color: #f0b90b;
        }
        .action-btn:active {
            opacity: 0.8;
        }

        /* Main Crypto Card (Exact Match to Screenshot) */
        .crypto-card {
            background-color: #10141d;
            border: 1px solid #1e2636;
            border-radius: 20px;
            width: 100%;
            max-width: 740px;
            padding: 22px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Table Header */
        .table-header {
            display: flex;
            align-items: center;
            color: #848e9c;
            font-size: 13px;
            font-weight: 600;
            padding-bottom: 14px;
            margin-bottom: 6px;
            border-bottom: 1px solid #18202e;
        }
        .col-drag {
            width: 26px;
            display: none;
        }
        body.edit-mode .col-drag {
            display: block;
        }
        .col-coin {
            flex: 1.8;
            text-align: left;
        }
        .col-price {
            flex: 1.2;
            text-align: right;
            padding-right: 14px;
        }
        .col-change {
            flex: 1.1;
            text-align: right;
            padding-right: 14px;
        }
        .col-chart {
            width: 90px;
            text-align: right;
            padding-right: 4px;
        }
        .col-del {
            width: 32px;
            display: none;
            text-align: right;
        }
        body.edit-mode .col-del {
            display: block;
        }

        /* Coin Rows */
        .coin-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .coin-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-radius: 10px;
            transition: background 0.2s, transform 0.15s;
            position: relative;
        }
        .coin-row.dragging {
            background: #182130;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            opacity: 0.95;
            z-index: 10;
        }

        /* Drag Handle */
        .drag-handle {
            width: 26px;
            color: #58667e;
            font-size: 18px;
            cursor: move;
            display: none;
            touch-action: none;
        }
        body.edit-mode .drag-handle {
            display: block;
        }

        /* Left Coin Info */
        .coin-info-wrap {
            flex: 1.8;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .coin-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #18202d;
            object-fit: cover;
            border: 1px solid #232d3f;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .coin-names {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .coin-full-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
        }
        .coin-ticker {
            font-size: 12px;
            font-weight: 600;
            color: #848e9c;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Price */
        .coin-price {
            flex: 1.2;
            text-align: right;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.3px;
            padding-right: 14px;
            transition: color 0.3s;
        }

        /* 24h Change */
        .coin-change {
            flex: 1.1;
            text-align: right;
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding-right: 14px;
        }
        .change-up {
            color: #0ecb81;
        }
        .change-down {
            color: #f6465d;
        }

        /* Golden Sparkline Chart */
        .coin-chart {
            width: 90px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 4px;
        }
        .spark-canvas {
            width: 86px;
            height: 36px;
            display: block;
        }

        /* Delete Button */
        .coin-del-wrap {
            width: 32px;
            display: none;
            text-align: right;
        }
        body.edit-mode .coin-del-wrap {
            display: block;
        }
        .row-del-btn {
            background: rgba(246, 70, 93, 0.2);
            border: 1px solid rgba(246, 70, 93, 0.5);
            color: #f6465d;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Price Tick Flash */
        .flash-up {
            color: #0ecb81 !important;
            text-shadow: 0 0 10px rgba(14, 203, 129, 0.5);
        }
        .flash-down {
            color: #f6465d !important;
            text-shadow: 0 0 10px rgba(246, 70, 93, 0.5);
        }

        /* Add Coin Bar at bottom */
        .card-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #18202e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .add-input {
            flex: 1;
            background: #151a24;
            border: 1px solid #232d3f;
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            outline: none;
        }
        .add-input:focus {
            border-color: #f0b90b;
        }
        .add-submit-btn {
            background: #f0b90b;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .add-submit-btn:active {
            background: #d4a30a;
        }
        .add-status-msg {
            font-size: 11px;
            color: #f0b90b;
            margin-top: 6px;
            display: none;
        }

        /* Quick Suggestions Chips */
        .chips-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .chip-btn {
            background: #141923;
            border: 1px solid #202737;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: #848e9c;
            cursor: pointer;
        }
        .chip-btn:active {
            background: #f0b90b;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- Top Trading Terminal Header: Clock, Market Sessions, Fear & Greed -->
    <div class="terminal-header">
        <!-- Clock & Date -->
        <div class="clock-block">
            <div class="clock-time-row">
                <span class="clock-time" id="clock-time">00:00</span>
                <span class="clock-sec" id="clock-sec">00</span>
                <span class="clock-ampm" id="clock-ampm">AM</span>
            </div>
            <div class="clock-date" id="clock-date">LOADING...</div>
        </div>

        <!-- Global Market Sessions (Tokyo, London, New York) -->
        <div class="sessions-block">
            <div class="sessions-label">Market Sessions</div>
            <div class="sessions-tags">
                <div class="session-badge" id="sess-tokyo">
                    <span class="dot"></span> Tokyo
                </div>
                <div class="session-badge" id="sess-london">
                    <span class="dot"></span> London
                </div>
                <div class="session-badge" id="sess-ny">
                    <span class="dot"></span> New York
                </div>
            </div>
        </div>

        <!-- Fear & Greed Index -->
        <div class="fng-block">
            <div class="fng-score-box">
                <span class="fng-number" id="fng-number">--</span>
                <span class="fng-sub">/ 100</span>
            </div>
            <div class="fng-meta">
                <span class="fng-title">Fear &amp; Greed</span>
                <span class="fng-label-val" id="fng-label">Loading...</span>
                <div class="fng-meter-bg">
                    <div class="fng-meter-fill" id="fng-meter"></div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="header-actions">
            <button class="action-btn" id="edit-toggle-btn" onclick="toggleEditMode()">✏️ Drag &amp; Remove</button>
            <button class="action-btn" onclick="resetToDefault()">↺ Default</button>
        </div>
    </div>

    <!-- Main Crypto Card (Exact Visual Layout from Screenshot) -->
    <div class="crypto-card">
        <!-- Table Column Headers -->
        <div class="table-header">
            <div class="col-drag"></div>
            <div class="col-coin">Coin</div>
            <div class="col-price">Price (USD)</div>
            <div class="col-change">24H Change %</div>
            <div class="col-chart">Chart</div>
            <div class="col-del"></div>
        </div>

        <!-- Dynamic Coin Rows -->
        <div class="coin-list" id="coin-list">
            <!-- Rows rendered by JS -->
        </div>

        <!-- Add Coin Input & Quick Chips -->
        <div class="card-footer">
            <div style="width: 100%;">
                <div class="add-row">
                    <input type="text" id="add-input" class="add-input" placeholder="Add Coin (e.g. PEPE, SUI, RENDER, NEAR, WIF, TAO)" onkeypress="if(event.keyCode==13) addFromInput()">
                    <button class="add-submit-btn" id="add-btn" onclick="addFromInput()">+ Add</button>
                </div>
                <div id="add-status" class="add-status-msg">Verifying coin on Binance...</div>
                <div class="chips-row">
                    <span style="font-size: 11px; color: #58667e; align-self: center; font-weight: 600;">POPULAR:</span>
                    <span class="chip-btn" onclick="addCoin('BTC')">+ BTC</span>
                    <span class="chip-btn" onclick="addCoin('SOL')">+ SOL</span>
                    <span class="chip-btn" onclick="addCoin('DOGE')">+ DOGE</span>
                    <span class="chip-btn" onclick="addCoin('ADA')">+ ADA</span>
                    <span class="chip-btn" onclick="addCoin('SUI')">+ SUI</span>
                    <span class="chip-btn" onclick="addCoin('PEPE')">+ PEPE</span>
                    <span class="chip-btn" onclick="addCoin('WLD')">+ WLD</span>
                    <span class="chip-btn" onclick="addCoin('TRUMP')">+ TRUMP</span>
                    <span class="chip-btn" onclick="addCoin('ETH')">+ ETH</span>
                    <span class="chip-btn" onclick="addCoin('NEAR')">+ NEAR</span>
                    <span class="chip-btn" onclick="addCoin('RENDER')">+ RENDER</span>
                    <span class="chip-btn" onclick="addCoin('SHIB')">+ SHIB</span>
                    <span class="chip-btn" onclick="addCoin('AVAX')">+ AVAX</span>
                    <span class="chip-btn" onclick="addCoin('WIF')">+ WIF</span>
                    <span class="chip-btn" onclick="addCoin('TAO')">+ TAO</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Exact 8 coins from user's image in the exact order
        var INITIAL_COINS = [
            { symbol: "BTCUSDT",  base: "BTC",   name: "Bitcoin" },
            { symbol: "SOLUSDT",  base: "SOL",   name: "Solana" },
            { symbol: "DOGEUSDT", base: "DOGE",  name: "Dogecoin" },
            { symbol: "ADAUSDT",  base: "ADA",   name: "Cardano" },
            { symbol: "SUIUSDT",  base: "SUI",   name: "Sui" },
            { symbol: "PEPEUSDT", base: "PEPE",  name: "Pepe" },
            { symbol: "WLDUSDT",  base: "WLD",   name: "Worldcoin" },
            { symbol: "TRUMPUSDT",base: "TRUMP", name: "OFFICIAL TRUMP" }
        ];

        var KNOWN_NAMES = {
            "BTC": "Bitcoin",
            "SOL": "Solana",
            "DOGE": "Dogecoin",
            "ADA": "Cardano",
            "SUI": "Sui",
            "PEPE": "Pepe",
            "WLD": "Worldcoin",
            "TRUMP": "OFFICIAL TRUMP",
            "ETH": "Ethereum",
            "BNB": "BNB",
            "XRP": "Ripple",
            "AVAX": "Avalanche",
            "LINK": "Chainlink",
            "NEAR": "NEAR Protocol",
            "RENDER": "Render",
            "RNDR": "Render",
            "SHIB": "Shiba Inu",
            "DOT": "Polkadot",
            "WIF": "dogwifhat",
            "TAO": "Bittensor",
            "FET": "Artificial Superintelligence",
            "INJ": "Injective",
            "TIA": "Celestia",
            "JUP": "Jupiter",
            "BONK": "Bonk",
            "FLOKI": "Floki",
            "MATIC": "Polygon",
            "POL": "Polygon"
        };

        var coins = [];
        var coinData = {};
        var lastPrices = {};
        var sparklines = {};
        var isEditMode = false;

        function getIconUrl(base) {
            return "https://assets.coincap.io/assets/icons/" + base.toLowerCase() + "@2x.png";
        }

        function loadSavedCoins() {
            try {
                var saved = localStorage.getItem("exact_crypto_coins_v4");
                if (saved) {
                    coins = JSON.parse(saved);
                }
            } catch(e) {}
            if (!coins || coins.length === 0) {
                coins = INITIAL_COINS.slice();
            }
        }

        function saveCoins() {
            try {
                localStorage.setItem("exact_crypto_coins_v4", JSON.stringify(coins));
            } catch(e) {}
        }

        function init() {
            loadSavedCoins();
            updateClock();
            setInterval(updateClock, 1000);

            fetchFearAndGreed();
            setInterval(fetchFearAndGreed, 60000);

            renderTableRows();
            fetchAllPrices();
            setInterval(fetchAllPrices, 3500);

            fetchAllSparklines();
            setInterval(fetchAllSparklines, 60000);
        }

        function updateClock() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            var s = now.getSeconds();
            var ampm = h >= 12 ? "PM" : "AM";
            h = h % 12;
            if (h === 0) h = 12;

            var hm = h + ":" + (m < 10 ? "0" : "") + m;
            var sStr = (s < 10 ? "0" : "") + s;

            document.getElementById("clock-time").innerText = hm;
            document.getElementById("clock-sec").innerText = sStr;
            document.getElementById("clock-ampm").innerText = ampm;

            var dNames = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            var mNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            document.getElementById("clock-date").innerText = dNames[now.getDay()] + ", " + mNames[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();

            updateSessions(now.getUTCHours(), now.getUTCMinutes());
        }

        // Global Market Trading Sessions
        function updateSessions(utcHour, utcMin) {
            var timeDec = utcHour + (utcMin / 60);

            // Tokyo: UTC 00:00 - 09:00
            var tokyoOpen = timeDec >= 0 && timeDec < 9;
            // London: UTC 08:00 - 16:30
            var londonOpen = timeDec >= 8 && timeDec < 16.5;
            // New York: UTC 13:30 - 20:00
            var nyOpen = timeDec >= 13.5 && timeDec < 20;

            setSessionBadge("sess-tokyo", tokyoOpen);
            setSessionBadge("sess-london", londonOpen);
            setSessionBadge("sess-ny", nyOpen);
        }

        function setSessionBadge(id, isOpen) {
            var el = document.getElementById(id);
            if (!el) return;
            if (isOpen) {
                el.className = "session-badge open";
            } else {
                el.className = "session-badge";
            }
        }

        // Live Fear and Greed Index API
        function fetchFearAndGreed() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://api.alternative.me/fng/?limit=1", true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var res = JSON.parse(xhr.responseText);
                    var item = res.data[0];
                    var val = parseInt(item.value);
                    var classification = item.value_classification;

                    var numEl = document.getElementById("fng-number");
                    var labelEl = document.getElementById("fng-label");
                    var meterEl = document.getElementById("fng-meter");

                    numEl.innerText = val;
                    labelEl.innerText = classification;
                    meterEl.style.width = Math.max(5, val) + "%";

                    var color = "#f6465d"; // Extreme Fear (Red)
                    if (val >= 25 && val < 45) {
                        color = "#ff9800"; // Fear (Orange)
                    } else if (val >= 45 && val < 55) {
                        color = "#f0b90b"; // Neutral (Yellow)
                    } else if (val >= 55 && val < 75) {
                        color = "#2ebd85"; // Greed (Light Green)
                    } else if (val >= 75) {
                        color = "#0ecb81"; // Extreme Greed (Bright Green)
                    }

                    numEl.style.color = color;
                    labelEl.style.color = color;
                    meterEl.style.backgroundColor = color;
                }
            };
            xhr.send();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            var btn = document.getElementById("edit-toggle-btn");
            if (isEditMode) {
                document.body.classList.add("edit-mode");
                btn.className = "action-btn active";
                btn.innerText = "✓ Done";
            } else {
                document.body.classList.remove("edit-mode");
                btn.className = "action-btn";
                btn.innerText = "✏️ Drag & Remove";
            }
        }

        function resetToDefault() {
            if (confirm("Reset coins list to original default?")) {
                coins = INITIAL_COINS.slice();
                saveCoins();
                renderTableRows();
                fetchAllPrices();
                fetchAllSparklines();
            }
        }

        function renderTableRows() {
            var container = document.getElementById("coin-list");
            var html = "";

            for (var i = 0; i < coins.length; i++) {
                var c = coins[i];
                var sym = c.symbol;
                var base = c.base;
                var name = c.name;
                var iconUrl = getIconUrl(base);

                html += '<div class="coin-row" id="row-' + sym + '" data-index="' + i + '">' +
                    '<div class="drag-handle" onmousedown="startDrag(event, ' + i + ')" ontouchstart="startTouchDrag(event, ' + i + ')">≡</div>' +
                    '<div class="coin-info-wrap">' +
                        '<img class="coin-logo" src="' + iconUrl + '" onerror="handleLogoError(this, \'' + base + '\')">' +
                        '<div class="coin-names">' +
                            '<span class="coin-full-name">' + name + '</span>' +
                            '<span class="coin-ticker">' + base + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="coin-price" id="pr-' + sym + '">--</div>' +
                    '<div class="coin-change" id="chg-' + sym + '">--</div>' +
                    '<div class="coin-chart">' +
                        '<canvas class="spark-canvas" id="canvas-' + sym + '"></canvas>' +
                    '</div>' +
                    '<div class="coin-del-wrap">' +
                        '<button class="row-del-btn" onclick="removeCoin(\'' + sym + '\')">✕</button>' +
                    '</div>' +
                '</div>';
            }

            container.innerHTML = html;

            // Reapply existing prices and sparklines
            for (var j = 0; j < coins.length; j++) {
                var s = coins[j].symbol;
                if (coinData[s]) {
                    updateRowDOM(s, coinData[s].price, coinData[s].change);
                }
                if (sparklines[s]) {
                    drawGoldenSparkline(s, sparklines[s]);
                }
            }
        }

        // Multi-level logo fallback
        function handleLogoError(img, base) {
            img.onerror = function() {
                // Final fallback: circular SVG with coin letter
                var svg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 42 42"><circle cx="21" cy="21" r="20" fill="%231a2332" stroke="%23f0b90b" stroke-width="2"/><text x="50%" y="54%" font-family="sans-serif" font-size="14" font-weight="bold" fill="%23f0b90b" text-anchor="middle" dominant-baseline="middle">' + base.substring(0, 3) + '</text></svg>';
                img.src = svg;
                img.onerror = null;
            };
            img.src = "https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/" + base.toLowerCase() + ".png";
        }

        // Fetch each coin price independently so one bad coin NEVER breaks the rest!
        function fetchAllPrices() {
            if (coins.length === 0) return;

            for (var i = 0; i < coins.length; i++) {
                fetchSingleCoinPrice(coins[i].symbol);
            }
        }

        function fetchSingleCoinPrice(sym) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://api.binance.com/api/v3/ticker/24hr?symbol=" + sym, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var item = JSON.parse(xhr.responseText);
                    var p = parseFloat(item.lastPrice);
                    var chg = parseFloat(item.priceChangePercent);
                    coinData[sym] = {
                        price: p,
                        change: chg,
                        open: parseFloat(item.openPrice),
                        high: parseFloat(item.highPrice),
                        low: parseFloat(item.lowPrice)
                    };
                    updateRowDOM(sym, p, chg);

                    if (!sparklines[sym]) {
                        sparklines[sym] = [coinData[sym].open, coinData[sym].low, coinData[sym].high, p];
                        drawGoldenSparkline(sym, sparklines[sym]);
                    }
                }
            };
            xhr.send();
        }

        function updateRowDOM(sym, price, change) {
            var prEl = document.getElementById("pr-" + sym);
            var chgEl = document.getElementById("chg-" + sym);

            if (!prEl || !chgEl) return;

            // Format price exactly like screenshot
            var formattedPrice = "";
            if (price >= 1000) {
                formattedPrice = price.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else if (price >= 1) {
                formattedPrice = price.toFixed(2);
            } else if (price >= 0.01) {
                formattedPrice = price.toFixed(2);
            } else if (price >= 0.0001) {
                formattedPrice = price.toFixed(4);
            } else {
                formattedPrice = price.toFixed(6);
            }

            // Flash effect
            if (lastPrices[sym] !== undefined) {
                if (price > lastPrices[sym]) {
                    prEl.className = "coin-price flash-up";
                    setTimeout(function() { if(prEl) prEl.className = "coin-price"; }, 400);
                } else if (price < lastPrices[sym]) {
                    prEl.className = "coin-price flash-down";
                    setTimeout(function() { if(prEl) prEl.className = "coin-price"; }, 400);
                }
            }
            lastPrices[sym] = price;

            prEl.innerText = formattedPrice;

            var chgStr = (change >= 0 ? "+" : "") + change.toFixed(2) + "%";
            chgEl.innerText = chgStr;
            chgEl.className = "coin-change " + (change >= 0 ? "change-up" : "change-down");
        }

        function fetchAllSparklines() {
            for (var i = 0; i < coins.length; i++) {
                fetchSingleSparkline(coins[i].symbol);
            }
        }

        function fetchSingleSparkline(sym) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://api.binance.com/api/v3/klines?symbol=" + sym + "&interval=1h&limit=24", true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var raw = JSON.parse(xhr.responseText);
                    var pts = [];
                    for (var j = 0; j < raw.length; j++) {
                        pts.push(parseFloat(raw[j][4])); // close prices
                    }
                    sparklines[sym] = pts;
                    drawGoldenSparkline(sym, pts);
                }
            };
            xhr.send();
        }

        // Draw exact golden yellow sparkline from the screenshot
        function drawGoldenSparkline(sym, data) {
            var c = document.getElementById("canvas-" + sym);
            if (!c || !data || data.length < 2) return;

            var dpr = window.devicePixelRatio || 1;
            c.width = 86 * dpr;
            c.height = 36 * dpr;

            var ctx = c.getContext("2d");
            ctx.scale(dpr, dpr);

            var w = 86;
            var h = 36;
            ctx.clearRect(0, 0, w, h);

            var min = Infinity;
            var max = -Infinity;
            for (var i = 0; i < data.length; i++) {
                if (data[i] < min) min = data[i];
                if (data[i] > max) max = data[i];
            }
            var range = max - min;
            if (range === 0) range = 1;

            ctx.beginPath();
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = "#e5b85a"; // Exact golden/yellow line color from screenshot
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            for (var k = 0; k < data.length; k++) {
                var x = (k / (data.length - 1)) * (w - 8) + 4;
                var y = h - ((data[k] - min) / range) * (h - 10) - 5;
                if (k === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // Clean & robust Add Coin logic (supports any altcoin on Binance)
        function addFromInput() {
            var inp = document.getElementById("add-input");
            var val = inp.value;
            if (!val || !val.trim()) return;
            addCoin(val);
            inp.value = "";
        }

        function addCoin(raw) {
            var clean = raw.toUpperCase().replace(/[^A-Z0-9]/g, ""); // removes slashes, dashes, spaces
            if (!clean) return;

            var base = clean;
            var sym = clean;

            // Handle whether user typed USDT or not
            if (clean.length > 4 && clean.substring(clean.length - 4) === "USDT") {
                base = clean.substring(0, clean.length - 4);
                sym = clean;
            } else {
                base = clean;
                sym = clean + "USDT";
            }

            // Check if already in list
            for (var i = 0; i < coins.length; i++) {
                if (coins[i].symbol === sym || coins[i].base === base) {
                    alert(base + " is already in your list!");
                    return;
                }
            }

            var statusEl = document.getElementById("add-status");
            if (statusEl) {
                statusEl.style.display = "block";
                statusEl.innerText = "Verifying " + base + " on Binance...";
            }

            // Verify live on Binance before adding
            var verifyXhr = new XMLHttpRequest();
            verifyXhr.open("GET", "https://api.binance.com/api/v3/ticker/price?symbol=" + sym, true);
            verifyXhr.onreadystatechange = function() {
                if (verifyXhr.readyState === 4) {
                    if (verifyXhr.status === 200) {
                        // Success! Pair exists on Binance
                        if (statusEl) statusEl.style.display = "none";
                        var name = KNOWN_NAMES[base] || base;
                        coins.push({ symbol: sym, base: base, name: name });
                        saveCoins();
                        renderTableRows();
                        fetchSingleCoinPrice(sym);
                        fetchSingleSparkline(sym);
                    } else {
                        // Symbol not found on Binance spot
                        if (statusEl) statusEl.style.display = "none";
                        alert('Coin "' + base + '" is not available as a USDT pair on Binance spot.\n(Make sure to use the official ticker, e.g. RENDER, NEAR, SUI, PEPE)');
                    }
                }
            };
            verifyXhr.send();
        }

        // Remove Coin logic
        function removeCoin(sym) {
            if (coins.length <= 1) {
                alert("You need at least 1 coin!");
                return;
            }
            for (var i = 0; i < coins.length; i++) {
                if (coins[i].symbol === sym) {
                    coins.splice(i, 1);
                    break;
                }
            }
            saveCoins();
            renderTableRows();
        }

        // Touch & Mouse Drag-and-Drop Reordering (100% iOS 9 Safari Compatible)
        var dragIdx = null;
        var startY = 0;

        function startTouchDrag(e, idx) {
            if (!isEditMode) return;
            dragIdx = idx;
            startY = e.touches[0].clientY;
            document.addEventListener("touchmove", onTouchMove, { passive: false });
            document.addEventListener("touchend", onTouchEnd);
        }

        function onTouchMove(e) {
            if (dragIdx === null) return;
            e.preventDefault();
            var currentY = e.touches[0].clientY;
            var diff = currentY - startY;

            var row = document.getElementById("row-" + coins[dragIdx].symbol);
            if (row) {
                row.classList.add("dragging");
                row.style.transform = "translateY(" + diff + "px)";
            }

            var rowHeight = 54;
            var targetIdx = dragIdx + Math.round(diff / rowHeight);
            if (targetIdx >= 0 && targetIdx < coins.length && targetIdx !== dragIdx) {
                var item = coins.splice(dragIdx, 1)[0];
                coins.splice(targetIdx, 0, item);
                dragIdx = targetIdx;
                startY = currentY;
                saveCoins();
                renderTableRows();
                var newRow = document.getElementById("row-" + coins[dragIdx].symbol);
                if (newRow) newRow.classList.add("dragging");
            }
        }

        function onTouchEnd() {
            if (dragIdx !== null) {
                var row = document.getElementById("row-" + coins[dragIdx].symbol);
                if (row) {
                    row.classList.remove("dragging");
                    row.style.transform = "";
                }
                dragIdx = null;
                saveCoins();
                renderTableRows();
            }
            document.removeEventListener("touchmove", onTouchMove);
            document.removeEventListener("touchend", onTouchEnd);
        }

        function startDrag(e, idx) {
            if (!isEditMode) return;
            dragIdx = idx;
            startY = e.clientY;
            document.addEventListener("mousemove", onMouseMove);
            document.addEventListener("mouseup", onMouseUp);
        }

        function onMouseMove(e) {
            if (dragIdx === null) return;
            var currentY = e.clientY;
            var diff = currentY - startY;

            var row = document.getElementById("row-" + coins[dragIdx].symbol);
            if (row) {
                row.classList.add("dragging");
                row.style.transform = "translateY(" + diff + "px)";
            }

            var rowHeight = 54;
            var targetIdx = dragIdx + Math.round(diff / rowHeight);
            if (targetIdx >= 0 && targetIdx < coins.length && targetIdx !== dragIdx) {
                var item = coins.splice(dragIdx, 1)[0];
                coins.splice(targetIdx, 0, item);
                dragIdx = targetIdx;
                startY = currentY;
                saveCoins();
                renderTableRows();
                var newRow = document.getElementById("row-" + coins[dragIdx].symbol);
                if (newRow) newRow.classList.add("dragging");
            }
        }

        function onMouseUp() {
            if (dragIdx !== null) {
                var row = document.getElementById("row-" + coins[dragIdx].symbol);
                if (row) {
                    row.classList.remove("dragging");
                    row.style.transform = "";
                }
                dragIdx = null;
                saveCoins();
                renderTableRows();
            }
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
        }

        window.onload = init;
    </script>
</body>
</html>
