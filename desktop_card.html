<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=700, height=480, initial-scale=1.0, user-scalable=no">
    <title>Trojan / Binance PnL Card</title>
    <style>
        :root {
            --bg-card: #0a0d14;
            --brand-green: #0ecb81;
            --brand-green-glow: rgba(14, 203, 129, 0.55);
            --brand-cyan: #38bdf8;
            --brand-yellow: #f0b90b;
            --text-gray: #848e9c;
            --text-dim: #606875;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 700px;
            height: 480px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 8px 10px;
        }

        /* Top Draggable Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px 8px;
            cursor: move;
            -webkit-app-region: drag;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .btn-tool:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-action-pin.active-pin {
            color: var(--brand-yellow);
            border-color: var(--brand-yellow);
            background: rgba(240, 185, 11, 0.15);
        }

        .btn-save-png {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }
        .btn-save-png:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .window-ctrls {
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-app-region: no-drag;
        }

        .btn-win {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-gray);
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
        }

        .btn-win:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .btn-win-close:hover {
            background: rgba(246, 70, 93, 0.35);
            color: #f6465d;
        }

        /* The Exact Cool PnL Card */
        .card-container {
            width: 680px;
            height: 420px;
            border-radius: 20px;
            background: #0a0d14;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
            display: flex;
            margin: 0 auto;
        }

        /* Left Side: Illustration / Custom Image */
        .art-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 60%;
            height: 100%;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
            overflow: hidden;
            background: #141720;
            cursor: pointer;
        }

        .art-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            transition: transform 0.2s ease;
        }

        .art-overlay-hint {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .art-box:hover .art-overlay-hint {
            opacity: 1;
        }

        /* Illuminated Diagonal Slash Line */
        .slash-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 60.5%;
            height: 100%;
            clip-path: polygon(99% 0, 100% 0, 80% 100%, 79% 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(56, 189, 248, 0.8) 40%, rgba(14, 203, 129, 0.6) 100%);
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
            pointer-events: none;
            z-index: 10;
        }

        /* Right Side: PnL Content */
        .stats-box {
            position: absolute;
            top: 0;
            right: 0;
            width: 52%;
            height: 100%;
            padding: 24px 28px 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
            z-index: 5;
            background: radial-gradient(circle at 90% 10%, #151b26 0%, #0a0d14 70%);
        }

        /* Top Right Branding */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .brand-logo-svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
        }

        .brand-title-group {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .brand-top-text {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
            line-height: 1.1;
        }

        .brand-sub-text {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--brand-cyan);
            line-height: 1.1;
        }

        /* Main Pair & PnL Section */
        .pnl-main-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-top: 4px;
        }

        .pair-label {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
            outline: none;
        }

        .pnl-percent {
            font-size: 54px;
            font-weight: 900;
            color: var(--brand-green);
            line-height: 1;
            letter-spacing: -1.5px;
            text-shadow: 0 0 24px var(--brand-green-glow), 0 0 45px rgba(14, 203, 129, 0.35);
            font-family: "SF Pro Display", -apple-system, sans-serif;
            outline: none;
            cursor: text;
        }

        /* Duration Strip */
        .duration-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 8px;
        }

        .arrow-btn {
            color: var(--text-gray);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        .arrow-btn:hover { color: #ffffff; }

        /* Two Columns (Invested / Current Gain) */
        .stats-grid {
            display: flex;
            gap: 32px;
            margin-top: 14px;
        }

        .col-stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-col-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-gray);
            margin-bottom: 4px;
        }
        .title-green { color: var(--brand-green); }

        .stat-crypto-val {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 900;
            font-family: "SF Pro Display", monospace;
            color: #ffffff;
            outline: none;
        }

        .coin-icon {
            width: 16px;
            height: 13px;
            display: inline-block;
        }

        .stat-usd-val {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-gray);
            margin-top: 2px;
            font-family: monospace;
            outline: none;
        }
        .usd-green { color: var(--brand-green); }

        /* Footer Row (Referral / Tag + QR) */
        .footer-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
        }

        .referral-box {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .ref-hint {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-gray);
            outline: none;
        }

        .ref-code {
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.3px;
            outline: none;
        }

        .qr-box {
            width: 44px;
            height: 44px;
            background: #ffffff;
            border-radius: 6px;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .qr-box svg {
            width: 100%;
            height: 100%;
        }

        /* Preset Picker Drawer */
        .presets-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            padding: 0 4px;
        }
        .preset-pill {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-gray);
            cursor: pointer;
        }
        .preset-pill:hover, .preset-pill.active {
            color: #ffffff;
            border-color: var(--brand-cyan);
            background: rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body>

            <!-- Pair & PnL Percent -->
            <div class="pnl-main-group">

                <div class="pnl-percent" id="pnl-percent-text" contenteditable="true" spellcheck="false">+491.23%</div>

        <button class="preset-pill active" onclick="loadPreset('money_heist_art.jpg')">🎭 Money Heist</button>
        <button class="preset-pill" onclick="loadMemePreset('pepe')">🐸 Pepe</button>
        <button class="preset-pill" onclick="loadMemePreset('gigachad')">🗿 Gigachad</button>
        <button class="preset-pill" onclick="loadMemePreset('doge')">🐶 Doge</button>

    <script src="crypto-js.min.js"></script>
    <script>
        // State
        var isPinned = true;
        var currentBrand = 'trojan'; // 'trojan' or 'binance'
        var artImg = document.getElementById('card-art-img');
        var fileInput = document.getElementById('file-input');
        var livePositions = [];
        var currentPosIdx = 0;

        // Restore saved custom image if present
        var savedImg = localStorage.getItem('pnl_custom_image');
        if (savedImg) {
            artImg.src = savedImg;
        }

        // Window controls via pywebview
        document.getElementById('btn-close').addEventListener('click', function() {
            if (window.pywebview && window.pywebview.api) window.pywebview.api.close();
            else window.close();
        });

        document.getElementById('btn-min').addEventListener('click', function() {
            if (window.pywebview && window.pywebview.api) window.pywebview.api.minimize();
        });

        document.getElementById('btn-pin').addEventListener('click', function() {
            isPinned = !isPinned;
            this.classList.toggle('active-pin', isPinned);
            if (window.pywebview && window.pywebview.api) window.pywebview.api.toggle_pin(isPinned);
        });

        // Image upload handling
        document.getElementById('btn-upload-trigger').addEventListener('click', function() {
            fileInput.click();
        });

        document.getElementById('art-box-trigger').addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        // Drag and drop onto card
        var card = document.getElementById('pnl-card-element');
        card.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
        });

        card.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            var reader = new FileReader();
            reader.onload = function(evt) {
                artImg.src = evt.target.result;
                try {
                    localStorage.setItem('pnl_custom_image', evt.target.result);
                } catch(e) {}
            };
            reader.readAsDataURL(file);
        }

        function loadPreset(src) {
            artImg.src = src;
            localStorage.removeItem('pnl_custom_image');
        }

        function loadMemePreset(name) {
            // High quality meme presets
            var urls = {
                'pepe': 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80',
                'gigachad': 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&q=80',
                'doge': 'https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=800&q=80',
                'bull': 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=800&q=80'
            };
            if (urls[name]) {
                artImg.src = urls[name];
                try {
                    localStorage.setItem('pnl_custom_image', urls[name]);
                } catch(e) {}
            }
        }

        // Brand Switcher (Trojan ⇄ Binance Pro)
        function toggleBrand() {
            currentBrand = currentBrand === 'trojan' ? 'binance' : 'trojan';
            var topText = document.getElementById('brand-title-top');
            var subText = document.getElementById('brand-title-sub');
            var logoBox = document.getElementById('brand-logo-container');
            var labelToggle = document.getElementById('label-brand-toggle');

            if (currentBrand === 'binance') {
                topText.textContent = 'BINANCE';
                subText.textContent = 'PRO FUTURES';
                subText.style.color = '#f0b90b';
                labelToggle.textContent = '⚡ Brand: Binance';
                logoBox.innerHTML = '<svg class="brand-logo-svg" viewBox="0 0 24 24" fill="#f0b90b"><path d="M12 2L8.5 5.5l3.5 3.5 3.5-3.5L12 2zm-6.5 6.5L2 12l3.5 3.5 3.5-3.5-3.5-3.5zm13 0l-3.5 3.5 3.5 3.5 3.5-3.5-3.5-3.5zM12 15.5l-3.5 3.5L12 22.5l3.5-3.5-3.5-3.5zm0-4.5L9.5 8.5 12 6l2.5 2.5L12 11zm0 2l2.5 2.5L12 18l-2.5-2.5L12 13z"/></svg>';
            } else {
                topText.textContent = 'TROJAN';
                subText.textContent = 'ON SOLANA';
                subText.style.color = '#38bdf8';
                labelToggle.textContent = '⚡ Brand: Trojan';
                logoBox.innerHTML = '<svg class="brand-logo-svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 19v-4l2-4-1-4 3-3 4 2 2 5-1 4v4"/><circle cx="11" cy="9" r="1" fill="#38bdf8"/><path d="M14 6l3 1-1 4"/></svg>';
            }
        }
        document.getElementById('btn-toggle-brand').addEventListener('click', toggleBrand);
        document.getElementById('brand-header-click').addEventListener('click', toggleBrand);

        // Live Binance Sync
        document.getElementById('btn-sync-binance').addEventListener('click', function() {
            var apiKey = localStorage.getItem('binance_user_apikey') || '';
            var secretKey = localStorage.getItem('binance_user_secret') || '';
            if (!apiKey || !secretKey) {
                alert('No Binance API key found! Please enter your Read-Only API key first.');
                return;
            }

            var ts = Date.now();
            var query = 'recvWindow=60000&timestamp=' + ts;
            var sig = CryptoJS.HmacSHA256(query, secretKey).toString(CryptoJS.enc.Hex);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://fapi.binance.com/fapi/v2/positionRisk?' + query + '&signature=' + sig, true);
            xhr.setRequestHeader('X-MBX-APIKEY', apiKey);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var list = JSON.parse(xhr.responseText);
                        livePositions = list.filter(function(p) { return parseFloat(p.positionAmt) !== 0; });
                        if (livePositions.length > 0) {
                            currentPosIdx = 0;
                            displayPosition(livePositions[0]);
                        } else {
                            alert('No active open positions currently found on Binance!');
                        }
                    } catch(e) {
                        alert('Error parsing Binance data.');
                    }
                } else {
                    alert('Binance request failed (Code: ' + xhr.status + ')');
                }
            };
            xhr.send();
        });

        function displayPosition(p) {
            var amt = parseFloat(p.positionAmt);
            var entry = parseFloat(p.entryPrice);
            var mark = parseFloat(p.markPrice);
            var pnl = parseFloat(p.unRealizedProfit);
            var lev = parseFloat(p.leverage) || 1;

            var margin = (Math.abs(amt) * entry) / lev;
            var roe = margin > 0 ? (pnl / margin) * 100 : 0;

            document.getElementById('pair-text').textContent = p.symbol.replace('USDT', '/USDT');
            var sign = roe >= 0 ? '+' : '';
            var pnlEl = document.getElementById('pnl-percent-text');
            pnlEl.textContent = sign + roe.toFixed(2) + '%';
            if (roe >= 0) {
                pnlEl.style.color = 'var(--brand-green)';
                pnlEl.style.textShadow = '0 0 24px var(--brand-green-glow)';
            } else {
                pnlEl.style.color = '#f6465d';
                pnlEl.style.textShadow = '0 0 24px rgba(246, 70, 93, 0.55)';
            }

            document.getElementById('invested-crypto').textContent = Math.abs(amt).toFixed(4);
            document.getElementById('invested-usd').textContent = '$' + margin.toFixed(2);
            document.getElementById('gain-crypto').textContent = (pnl >= 0 ? '+' : '') + '$' + Math.abs(pnl).toFixed(2);
            document.getElementById('gain-usd').textContent = (roe >= 0 ? '+' : '') + roe.toFixed(2) + '%';
        }

        document.getElementById('next-pos').addEventListener('click', function() {
            if (livePositions.length > 1) {
                currentPosIdx = (currentPosIdx + 1) % livePositions.length;
                displayPosition(livePositions[currentPosIdx]);
            }
        });

        document.getElementById('prev-pos').addEventListener('click', function() {
            if (livePositions.length > 1) {
                currentPosIdx = (currentPosIdx - 1 + livePositions.length) % livePositions.length;
                displayPosition(livePositions[currentPosIdx]);
            }
        });

        // Export High-Res PNG Card
        document.getElementById('btn-export-png').addEventListener('click', function() {
            var canvas = document.getElementById('export-canvas');
            var ctx = canvas.getContext('2d');
            var W = 1360;
            var H = 840;

            // Clear & Draw base background
            ctx.fillStyle = '#0a0d14';
            ctx.fillRect(0, 0, W, H);

            // Draw radial glow on right
            var radial = ctx.createRadialGradient(W * 0.85, H * 0.15, 50, W * 0.85, H * 0.15, W * 0.6);
            radial.addColorStop(0, '#151b26');
            radial.addColorStop(1, '#0a0d14');
            ctx.fillStyle = radial;
            ctx.fillRect(0, 0, W, H);

            // Draw Left Art Image clipped to polygon
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(W * 0.60, 0);
            ctx.lineTo(W * 0.48, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.clip();

            // Cover fit image
            var imgW = artImg.naturalWidth || artImg.width || 600;
            var imgH = artImg.naturalHeight || artImg.height || 640;
            var scale = Math.max((W * 0.60) / imgW, H / imgH);
            var sw = imgW * scale;
            var sh = imgH * scale;
            ctx.drawImage(artImg, 0, (H - sh) / 2, sw, sh);
            ctx.restore();

            // Draw illuminated diagonal slash border
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(W * 0.60, 0);
            ctx.lineTo(W * 0.48, H);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.restore();

            // Text Styles
            ctx.textAlign = 'right';

            // Brand
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText(document.getElementById('brand-title-top').textContent, W - 60, 65);
            ctx.fillStyle = currentBrand === 'binance' ? '#f0b90b' : '#38bdf8';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(document.getElementById('brand-title-sub').textContent, W - 60, 92);

            // Pair
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 56px sans-serif';
            ctx.fillText(document.getElementById('pair-text').textContent, W - 60, 200);

            // PnL %
            var pnlText = document.getElementById('pnl-percent-text').textContent;
            ctx.fillStyle = pnlText.indexOf('-') !== -1 ? '#f6465d' : '#0ecb81';
            ctx.font = '900 108px sans-serif';
            ctx.shadowColor = pnlText.indexOf('-') !== -1 ? 'rgba(246, 70, 93, 0.6)' : 'rgba(14, 203, 129, 0.7)';
            ctx.shadowBlur = 25;
            ctx.fillText(pnlText, W - 60, 310);
            ctx.shadowBlur = 0; // reset

            // Duration
            ctx.fillStyle = '#cbd5e1';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText(document.getElementById('duration-text').textContent, W - 60, 365);

            // Stats Headers
            ctx.font = 'bold 26px sans-serif';
            ctx.fillStyle = '#848e9c';
            ctx.fillText('Invested', W - 320, 480);
            ctx.fillStyle = '#0ecb81';
            ctx.fillText('Current Gain', W - 60, 480);

            // Stats Values
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 34px monospace';
            ctx.fillText(document.getElementById('invested-crypto').textContent + ' SOL', W - 320, 525);
            ctx.fillStyle = '#0ecb81';
            ctx.fillText(document.getElementById('gain-crypto').textContent + ' SOL', W - 60, 525);

            // USD subtext
            ctx.fillStyle = '#848e9c';
            ctx.font = 'bold 24px monospace';
            ctx.fillText(document.getElementById('invested-usd').textContent, W - 320, 565);
            ctx.fillStyle = '#0ecb81';
            ctx.fillText(document.getElementById('gain-usd').textContent, W - 60, 565);

            // Referral
            ctx.fillStyle = '#848e9c';
            ctx.font = '22px sans-serif';
            ctx.fillText(document.getElementById('ref-hint').textContent, W - 150, 720);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText(document.getElementById('ref-code').textContent, W - 150, 755);

            // Draw QR Box in bottom right
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(W - 130, 680, 75, 75);
            ctx.fillStyle = '#000000';
            ctx.fillRect(W - 120, 690, 20, 20);
            ctx.fillRect(W - 85, 690, 20, 20);
            ctx.fillRect(W - 120, 725, 20, 20);

            // Download Trigger
            var link = document.createElement('a');
            link.download = 'PnL_Card_' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
