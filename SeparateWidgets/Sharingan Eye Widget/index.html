<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharingan Eye Live Widget</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #090a0f !important;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="widget-touch-area" class="widget-wrapper">
        <div id="hud-tag" class="hud-tag">3-TOMOE</div>

        <svg id="eye-svg" class="eye-svg" viewBox="0 0 300 300">
            <defs>
                <radialGradient id="iris-g" cx="50%" cy="50%" r="50%" fx="42%" fy="40%">
                    <stop offset="0%" stop-color="#ff334b" />
                    <stop offset="28%" stop-color="#e60021" />
                    <stop offset="60%" stop-color="#990014" />
                    <stop offset="85%" stop-color="#4d000a" />
                    <stop offset="97%" stop-color="#1f0003" />
                    <stop offset="100%" stop-color="#050001" />
                </radialGradient>
                <radialGradient id="rim-g" cx="50%" cy="50%" r="50%">
                    <stop offset="72%" stop-color="rgba(0,0,0,0)" />
                    <stop offset="92%" stop-color="rgba(5,0,2,0.65)" />
                    <stop offset="100%" stop-color="rgba(0,0,0,0.98)" />
                </radialGradient>
            </defs>

            <circle cx="150" cy="150" r="140" fill="#040203" stroke="#260408" stroke-width="3" />
            <circle cx="150" cy="150" r="132" fill="url(#iris-g)" />

            <g opacity="0.32" stroke="#400006" stroke-width="1.2">
                <line x1="150" y1="150" x2="150" y2="20" />
                <line x1="150" y1="150" x2="242" y2="58" />
                <line x1="150" y1="150" x2="280" y2="150" />
                <line x1="150" y1="150" x2="242" y2="242" />
                <line x1="150" y1="150" x2="150" y2="280" />
                <line x1="150" y1="150" x2="58" y2="242" />
                <line x1="150" y1="150" x2="20" y2="150" />
                <line x1="150" y1="150" x2="58" y2="58" />
                <line x1="150" y1="150" x2="196" y2="35" />
                <line x1="150" y1="150" x2="265" y2="104" />
                <line x1="150" y1="150" x2="265" y2="196" />
                <line x1="150" y1="150" x2="196" y2="265" />
                <line x1="150" y1="150" x2="104" y2="265" />
                <line x1="150" y1="150" x2="35" y2="196" />
                <line x1="150" y1="150" x2="35" y2="104" />
                <line x1="150" y1="150" x2="104" y2="35" />
            </g>

            <g id="rolling-group" class="rolling-group">
                <g id="pattern-classic">
                    <circle cx="150" cy="150" r="66" fill="none" stroke="#1f0003" stroke-width="2.5" opacity="0.85"/>
                    <circle cx="150" cy="150" r="22" fill="#050505"/>
                    <g transform="translate(150, 150)">
                        <g transform="rotate(0)">
                            <path d="M 0 -77 A 11.5 11.5 0 1 1 -11 -64 C -11 -49 5 -37 16 -31 C 8 -38 1 -50 1 -58 A 11.5 11.5 0 0 1 0 -77 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(120)">
                            <path d="M 0 -77 A 11.5 11.5 0 1 1 -11 -64 C -11 -49 5 -37 16 -31 C 8 -38 1 -50 1 -58 A 11.5 11.5 0 0 1 0 -77 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(240)">
                            <path d="M 0 -77 A 11.5 11.5 0 1 1 -11 -64 C -11 -49 5 -37 16 -31 C 8 -38 1 -50 1 -58 A 11.5 11.5 0 0 1 0 -77 Z" fill="#050505"/>
                        </g>
                    </g>
                </g>

                <g id="pattern-itachi" style="display:none;">
                    <circle cx="150" cy="150" r="22" fill="#050505"/>
                    <g transform="translate(150, 150)">
                        <path d="M 0 -22 C 30 -35 88 -72 102 -98 C 103 -80 82 -25 45 -4 C 28 6 12 18 0 0 Z" fill="#050505"/>
                        <g transform="rotate(120)">
                            <path d="M 0 -22 C 30 -35 88 -72 102 -98 C 103 -80 82 -25 45 -4 C 28 6 12 18 0 0 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(240)">
                            <path d="M 0 -22 C 30 -35 88 -72 102 -98 C 103 -80 82 -25 45 -4 C 28 6 12 18 0 0 Z" fill="#050505"/>
                        </g>
                    </g>
                </g>

                <g id="pattern-kamui" style="display:none;">
                    <circle cx="150" cy="150" r="108" fill="none" stroke="#050505" stroke-width="12"/>
                    <circle cx="150" cy="150" r="24" fill="#050505"/>
                    <g transform="translate(150, 150)">
                        <path d="M 0 -24 L 20 -22 C 55 -55 85 -85 106 -96 C 85 -55 45 -15 22 2 Z" fill="#050505"/>
                        <g transform="rotate(120)">
                            <path d="M 0 -24 L 20 -22 C 55 -55 85 -85 106 -96 C 85 -55 45 -15 22 2 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(240)">
                            <path d="M 0 -24 L 20 -22 C 55 -55 85 -85 106 -96 C 85 -55 45 -15 22 2 Z" fill="#050505"/>
                        </g>
                    </g>
                </g>

                <g id="pattern-sasuke" style="display:none;">
                    <g transform="translate(150, 150)">
                        <path d="M 0 -115 C 15 -70 15 70 0 115 C -15 70 -15 -70 0 -115 Z" fill="#050505"/>
                        <g transform="rotate(60)">
                            <path d="M 0 -115 C 15 -70 15 70 0 115 C -15 70 -15 -70 0 -115 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(120)">
                            <path d="M 0 -115 C 15 -70 15 70 0 115 C -15 70 -15 -70 0 -115 Z" fill="#050505"/>
                        </g>
                        <circle cx="0" cy="0" r="34" fill="#d4001d"/>
                        <circle cx="0" cy="0" r="14" fill="#050505"/>
                        <g transform="scale(0.52)">
                            <path d="M 0 -22 C 30 -35 88 -72 102 -98 C 103 -80 82 -25 45 -4 C 28 6 12 18 0 0 Z" fill="#050505"/>
                            <g transform="rotate(120)">
                                <path d="M 0 -22 C 30 -35 88 -72 102 -98 C 103 -80 82 -25 45 -4 C 28 6 12 18 0 0 Z" fill="#050505"/>
                            </g>
                            <g transform="rotate(240)">
                                <path d="M 0 -22 C 30 -35 88 -72 102 -98 C 103 -80 82 -25 45 -4 C 28 6 12 18 0 0 Z" fill="#050505"/>
                            </g>
                        </g>
                    </g>
                </g>

                <g id="pattern-shisui" style="display:none;">
                    <circle cx="150" cy="150" r="22" fill="#050505"/>
                    <g transform="translate(150, 150)">
                        <path d="M 0 -22 C 22 -40 70 -72 88 -96 C 76 -74 42 -35 22 0 Z" fill="#050505"/>
                        <g transform="rotate(90)">
                            <path d="M 0 -22 C 22 -40 70 -72 88 -96 C 76 -74 42 -35 22 0 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(180)">
                            <path d="M 0 -22 C 22 -40 70 -72 88 -96 C 76 -74 42 -35 22 0 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(270)">
                            <path d="M 0 -22 C 22 -40 70 -72 88 -96 C 76 -74 42 -35 22 0 Z" fill="#050505"/>
                        </g>
                    </g>
                </g>

                <g id="pattern-madara" style="display:none;">
                    <circle cx="150" cy="150" r="22" fill="#050505"/>
                    <circle cx="150" cy="150" r="66" fill="none" stroke="#050505" stroke-width="12"/>
                    <circle cx="150" cy="150" r="106" fill="none" stroke="#050505" stroke-width="7"/>
                    <g transform="translate(150, 150)">
                        <path d="M 0 -66 C 16 -76 25 -96 0 -106 C -25 -96 -16 -76 0 -66 Z" fill="#050505"/>
                        <g transform="rotate(120)">
                            <path d="M 0 -66 C 16 -76 25 -96 0 -106 C -25 -96 -16 -76 0 -66 Z" fill="#050505"/>
                        </g>
                        <g transform="rotate(240)">
                            <path d="M 0 -66 C 16 -76 25 -96 0 -106 C -25 -96 -16 -76 0 -66 Z" fill="#050505"/>
                        </g>
                    </g>
                </g>
            </g>

            <circle cx="150" cy="150" r="132" fill="url(#rim-g)" pointer-events="none" />
            <ellipse cx="112" cy="100" rx="34" ry="17" transform="rotate(-38 112 100)" fill="white" opacity="0.18" pointer-events="none" />
            <circle cx="102" cy="94" r="5" fill="white" opacity="0.45" pointer-events="none" />
        </svg>

        <div id="hud-clock" class="hud-clock">00:00:00</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
