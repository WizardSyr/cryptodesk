<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPadOS Analog Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-widget-container" id="clock-container" onclick="cycleCity()">
        <div class="clock-face">
            <div class="city-label" id="city-label">LA</div>
            
            <!-- Dial Numerals 1 to 12 -->
            <div class="num n-12">12</div>
            <div class="num n-1">1</div>
            <div class="num n-2">2</div>
            <div class="num n-3">3</div>
            <div class="num n-4">4</div>
            <div class="num n-5">5</div>
            <div class="num n-6">6</div>
            <div class="num n-7">7</div>
            <div class="num n-8">8</div>
            <div class="num n-9">9</div>
            <div class="num n-10">10</div>
            <div class="num n-11">11</div>

            <!-- Clock Hands -->
            <div class="hand hour-hand" id="hour-hand"></div>
            <div class="hand min-hand" id="min-hand"></div>
            <div class="hand sec-hand" id="sec-hand">
                <div class="sec-tail"></div>
            </div>
            <div class="center-pin"></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
