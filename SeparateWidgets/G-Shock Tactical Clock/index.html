<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gshock-touch" class="gshock-case">
        <div class="case-screw screw-tl"></div>
        <div class="case-screw screw-tr"></div>
        <div class="case-screw screw-bl"></div>
        <div class="case-screw screw-br"></div>

        <div>
            <div class="gshock-brand">G-SHOCK</div>
            <div class="gshock-sub">CASIO • PROTECTION</div>
        </div>

        <div class="gshock-bezel-inner">
            <div class="gshock-badges-top">
                <span>ALARM CHRONO</span>
                <span style="color:#f59e0b;">WATER 20BAR</span>
                <span>ILLUMINATOR</span>
            </div>

            <div id="gshock-lcd" class="gshock-lcd">
                <div class="lcd-top-row">
                    <span id="lcd-day" class="lcd-day">FRI</span>
                    <span id="lcd-date" class="lcd-date">11-27</span>
                </div>

                <div class="lcd-time-row">
                    <span id="lcd-h" class="lcd-digits">03</span>
                    <span class="lcd-colon">:</span>
                    <span id="lcd-m" class="lcd-digits">16</span>
                    <span id="lcd-s" class="lcd-sec">37</span>
                </div>

                <div class="lcd-bot-row">
                    <span>24H</span>
                    <span>SHOCK RESIST</span>
                    <span style="color:#b91c1c;">EL LIGHT</span>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; font-size:6px; color:#64748b; font-weight:800;">
                <span>ADJUST</span>
                <span>LIGHT</span>
                <span>MODE</span>
                <span>START</span>
            </div>
        </div>

        <div class="gshock-footer">SHOCK RESISTANT • JAPAN MOV'T</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
