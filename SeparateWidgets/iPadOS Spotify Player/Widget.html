<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPadOS Spotify Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="music-card theme-coral" id="music-card">
        <!-- Top Row: Album Thumb, Song Title, Artist, Spotify / Music Icon -->
        <div class="now-playing-row">
            <div class="thumb-wrap" onclick="togglePlay()">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120&auto=format&fit=crop&q=80" alt="Cover" class="now-thumb" id="now-thumb">
                <div class="play-indicator" id="play-indicator">▶</div>
            </div>
            <div class="track-info">
                <div class="track-title" id="track-title">Shall we☆Carnival</div>
                <div class="track-artist" id="track-artist">i☆Ris</div>
            </div>
            <div class="brand-icon-box" onclick="toggleTheme()" title="Switch Spotify / Apple Music Theme">
                <svg viewBox="0 0 24 24" class="spotify-logo-svg" id="brand-svg">
                    <!-- Spotify Logo -->
                    <circle cx="12" cy="12" r="10" fill="#1db954"/>
                    <path d="M7 9 C 10 8, 14 8, 17 9.8 M7.5 12 C 10 11.2, 13.5 11.2, 16.5 12.8 M8 15 C 10 14.4, 13 14.4, 15.5 15.6" stroke="#000" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
            </div>
        </div>

        <!-- Progress Bar & Controls -->
        <div class="progress-section">
            <div class="progress-bar-track" onclick="scrub(event)">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-time-row">
                <span id="time-current">1:12</span>
                <span id="time-total">3:45</span>
            </div>
        </div>

        <!-- Bottom Row: 4 Album Covers (Image 4) -->
        <div class="recent-albums-row">
            <div class="album-slot active" onclick="selectTrack(0)" id="slot-0">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120&auto=format&fit=crop&q=80" alt="Cover 1">
            </div>
            <div class="album-slot" onclick="selectTrack(1)" id="slot-1">
                <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=120&auto=format&fit=crop&q=80" alt="Cover 2">
            </div>
            <div class="album-slot" onclick="selectTrack(2)" id="slot-2">
                <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=120&auto=format&fit=crop&q=80" alt="Cover 3">
            </div>
            <div class="album-slot" onclick="selectTrack(3)" id="slot-3">
                <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=80" alt="Cover 4">
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
