<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stocks Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stocks-card">
        <div>
            <div class="stocks-top-header">
                <div>
                    <div class="stock-symbol-row">
                        <span style="font-size:12px;opacity:0.8;"></span>
                        <span class="stock-ticker">AAPL</span>
                    </div>
                    <div class="stock-name">Apple Inc.</div>
                </div>
                <div class="stock-chg">+0.41%</div>
            </div>
            <div class="stock-price-hero">199.20</div>
            <div class="stock-stats-grid">
                <span>Open 198.50</span>
                <span>High 200.10</span>
                <span>Low 197.80</span>
                <span>Cap 3.05T</span>
            </div>
        </div>
        <div class="stock-canvas-wrap">
            <canvas id="stock-chart" width="272" height="52"></canvas>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
