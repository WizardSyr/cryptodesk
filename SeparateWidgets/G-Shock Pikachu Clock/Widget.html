<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pika-touch" class="pika-case">
        <div class="case-screw screw-tl"></div>
        <div class="case-screw screw-tr"></div>
        <div class="case-screw screw-bl"></div>
        <div class="case-screw screw-br"></div>

        <div>
            <div class="pika-brand">G-SHOCK ⚡</div>
            <div class="pika-sub">POKÉMON • PIKACHU #025</div>
        </div>

        <div class="pika-bezel-inner">
            <div class="pika-badges-top">
                <span>⚡ THUNDERBOLT</span>
                <span style="color:#ef4444;">🔴 POKÉBALL</span>
                <span>VOLT TACKLE</span>
            </div>

            <div id="pika-lcd" class="pika-lcd">
                <div class="lcd-top-row">
                    <span id="lcd-day" class="lcd-day">FRI</span>
                    <span id="lcd-date" class="lcd-date">11-27</span>
                </div>

                <div class="lcd-time-row">
                    <span id="lcd-h" class="lcd-digits">03</span>
                    <span class="lcd-colon">:</span>
                    <span id="lcd-m" class="lcd-digits">16</span>
                    <span id="lcd-s" class="lcd-sec">37</span>
                </div>

                <div class="lcd-bot-row">
                    <span>24H</span>
                    <span style="color:#b91c1c;">PIKA PIKA!</span>
                    <span>TAIL ⚡ SHOCK</span>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; font-size:6px; color:#94a3b8; font-weight:800;">
                <span>THUNDER</span>
                <span>SPARK</span>
                <span>ITEM</span>
                <span>ATTACK</span>
            </div>
        </div>

        <div class="pika-footer">ELECTRIC TYPE • NINTENDO / GAME FREAK</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
