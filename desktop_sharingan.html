<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uchiha Sharingan Dynamic Widget</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulse-chakra {
      0%, 100% {
        filter: drop-shadow(0 0 18px rgba(255, 10, 40, 0.75)) drop-shadow(0 0 35px rgba(210, 0, 30, 0.45));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 28px rgba(255, 30, 70, 0.95)) drop-shadow(0 0 55px rgba(255, 0, 40, 0.7));
        transform: scale(1.018);
      }
    }

    @-webkit-keyframes pulse-chakra {
      0%, 100% {
        -webkit-filter: drop-shadow(0 0 18px rgba(255, 10, 40, 0.75));
        -webkit-transform: scale(1);
      }
      50% {
        -webkit-filter: drop-shadow(0 0 32px rgba(255, 30, 70, 0.95));
        -webkit-transform: scale(1.018);
      }
    }

    .eye-pulse {
      animation: pulse-chakra 3.2s ease-in-out infinite;
      -webkit-animation: pulse-chakra 3.2s ease-in-out infinite;
    }

    @keyframes spin-cw {
      from { transform: rotate(0deg); -webkit-transform: rotate(0deg); }
      to { transform: rotate(360deg); -webkit-transform: rotate(360deg); }
    }

    @-webkit-keyframes spin-cw {
      from { -webkit-transform: rotate(0deg); }
      to { -webkit-transform: rotate(360deg); }
    }

    @keyframes spin-ccw {
      from { transform: rotate(360deg); -webkit-transform: rotate(360deg); }
      to { transform: rotate(0deg); -webkit-transform: rotate(0deg); }
    }

    @-webkit-keyframes spin-ccw {
      from { -webkit-transform: rotate(360deg); }
      to { -webkit-transform: rotate(0deg); }
    }

    .rolling-layer {
      transform-origin: 150px 150px;
      -webkit-transform-origin: 150px 150px;
      animation: spin-cw var(--spin-speed, 4s) linear infinite;
      -webkit-animation: spin-cw var(--spin-speed, 4s) linear infinite;
      transition: opacity 0.3s ease;
    }

    .rolling-ccw {
      animation-name: spin-ccw !important;
      -webkit-animation-name: spin-ccw !important;
    }

    /* Activation Flash */
    @keyframes ocular-flash {
      0% { filter: brightness(1) drop-shadow(0 0 20px #f00); }
      40% { filter: brightness(2.6) drop-shadow(0 0 60px #ff2255); }
      100% { filter: brightness(1) drop-shadow(0 0 20px #f00); }
    }
    .flashing {
      animation: ocular-flash 0.5s ease-out !important;
    }

    /* Ambient Ember particles */
    .ember {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #ff5566 20%, #cc0022 70%, transparent 100%);
      pointer-events: none;
      animation: float-ember 4s linear infinite;
      opacity: 0;
    }
    @keyframes float-ember {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-90px) scale(1.3); opacity: 0; }
    }

    /* Sleek scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #331118; border-radius: 2px; }
  </style>
</head>
<body class="bg-[#08090d] text-white antialiased p-0 m-0 select-none overflow-x-hidden font-sans">

  <!-- Main Container -->

        <!-- Realistic Glass Reflection / Eye Highlight -->

    <!-- Active Form Title -->
    <div class="text-center my-1">
      <div id="form-name" class="text-sm font-black tracking-widest text-red-400 uppercase drop-shadow-[0_0_8px_rgba(255,50,50,0.6)]">

      </div>

    <!-- Controls Panel -->

      <!-- 1. Eye Form Switcher Pills -->

        <label class="text-[11px] text-zinc-400 font-semibold tracking-wider uppercase mb-1.5 block">Select Eye Form:</label>

          <button class="form-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900/90 text-zinc-400 transition-all hover:border-red-900 hover:text-white" data-form="itachi">
            Itachi
          </button>
          <button class="form-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900/90 text-zinc-400 transition-all hover:border-red-900 hover:text-white" data-form="kamui">
            Kamui
          </button>
          <button class="form-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900/90 text-zinc-400 transition-all hover:border-red-900 hover:text-white" data-form="sasuke">
            Sasuke EMS
          </button>
          <button class="form-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900/90 text-zinc-400 transition-all hover:border-red-900 hover:text-white" data-form="shisui">
            Shisui
          </button>
          <button class="form-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900/90 text-zinc-400 transition-all hover:border-red-900 hover:text-white" data-form="madara">
            Madara
          </button>
        </div>
      </div>

      <!-- 2. Rolling Speed & Direction -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-zinc-800/80 text-xs">
        
        <!-- Speed Buttons -->
        <div class="flex items-center gap-1">
          <span class="text-zinc-500 text-[11px] font-mono mr-1">Speed:</span>
          <button class="speed-btn px-2 py-1 rounded bg-zinc-800/80 text-zinc-300 text-[11px] hover:bg-red-950" data-speed="8s">Slow</button>
          <button class="speed-btn active px-2 py-1 rounded bg-red-900/80 text-white text-[11px] border border-red-600" data-speed="4s">Normal</button>
          <button class="speed-btn px-2 py-1 rounded bg-zinc-800/80 text-zinc-300 text-[11px] hover:bg-red-950" data-speed="1.6s">Fast</button>

        <!-- Spin Direction & Sound -->
        <div class="flex items-center gap-2">
          <button id="dir-btn" class="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[11px] flex items-center gap-1" title="Toggle Spin Direction">
            <span id="dir-icon">↻</span> CW
          </button>
          <button id="surge-btn" class="px-2.5 py-1 rounded bg-red-950/70 hover:bg-red-800 text-red-300 border border-red-800/60 text-[11px] font-bold flex items-center gap-1 shadow-sm">
            ⚡ Surge

      </div>

    </div>

    <!-- Bottom Helper Note -->
    <div class="w-full text-center mt-3 text-[10px] text-zinc-600 font-mono">
      💡 Tip: Click the eye or press "Surge" to trigger Chakra surge & rapid ocular acceleration!
    </div>

  </div>

  <script>
    // Audio Synthesizer for Chakra / Sharingan Hum (zero external assets, 100% offline)
    let audioCtx = null;
    function playChakraSound(type = 'activate') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        
        // Deep resonant bass hum
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(type === 'activate' ? 140 : 90, now);
        osc.frequency.exponentialRampToValueAtTime(type === 'activate' ? 360 : 60, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);

        // High frequency chime
        if (type === 'activate') {
          const chime = audioCtx.createOscillator();
          const chimeGain = audioCtx.createGain();
          chime.type = 'triangle';
          chime.frequency.setValueAtTime(980, now);
          chime.frequency.exponentialRampToValueAtTime(1450, now + 0.25);
          chimeGain.gain.setValueAtTime(0.12, now);
          chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          chime.connect(chimeGain);
          chimeGain.connect(audioCtx.destination);
          chime.start(now);
          chime.stop(now + 0.4);
        }
      } catch (e) {
        // AudioContext not allowed or muted
      }
    }

    // Live Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const clockEl = document.getElementById('ninja-clock');
      if (clockEl) clockEl.textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Floating Embers
    const embersContainer = document.getElementById('embers-container');
    function spawnEmber() {
      if (!embersContainer) return;
      const ember = document.createElement('div');
      ember.className = 'ember';
      const size = Math.random() * 4 + 2;
      ember.style.width = size + 'px';
      ember.style.height = size + 'px';
      ember.style.left = (Math.random() * 80 + 10) + '%';
      ember.style.bottom = (Math.random() * 30 + 10) + '%';
      ember.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
      embersContainer.appendChild(ember);
      setTimeout(() => ember.remove(), 4000);
    }
    setInterval(spawnEmber, 350);

    // DOM Elements
    const rollingLayer = document.getElementById('rolling-layer');
    const sharinganSvg = document.getElementById('sharingan-svg');
    const eyeContainer = document.getElementById('eye-container');
    const formNameEl = document.getElementById('form-name');
    const formSubEl = document.getElementById('form-sub');
    const dirBtn = document.getElementById('dir-btn');
    const dirIcon = document.getElementById('dir-icon');
    const surgeBtn = document.getElementById('surge-btn');

    let currentSpeed = '4s';
    let isClockwise = true;
    let isSurging = false;

    const formsData = {
      classic: {
        name: 'Classic 3-Tomoe',
        sub: 'Uchiha Clan Awakened Eye • 洞察眼 (Insight)'
      },
      itachi: {
        name: "Itachi's Mangekyō",
        sub: 'Amaterasu & Tsukuyomi • 天照 / 月読'
      },
      kamui: {
        name: 'Kakashi & Obito Kamui',
        sub: 'Space-Time Warp Ocular Power • 神威'
      },
      sasuke: {
        name: "Sasuke's Eternal Mangekyō",
        sub: 'Eternal Light & Flame Control • 永遠の万華鏡'
      },
      shisui: {
        name: "Shisui's Kotoamatsukami",
        sub: 'Supreme Mind Infiltration • 別天神'
      },
      madara: {
        name: "Madara's Eternal Mangekyō",
        sub: 'Legendary Founder Susanoo Core • 斑'
      }
    };

    // Form Switching
    const formButtons = document.querySelectorAll('.form-btn');
    const patterns = document.querySelectorAll('.eye-pattern');

    function switchForm(formKey) {
      patterns.forEach(p => p.style.display = 'none');
      const targetPattern = document.getElementById(`pattern-${formKey}`);
      if (targetPattern) {
        targetPattern.style.display = 'block';
      }

      formButtons.forEach(btn => {
        if (btn.dataset.form === formKey) {
          btn.classList.add('active', 'border-red-500', 'bg-red-950/80', 'text-white');
          btn.classList.remove('border-zinc-800', 'bg-zinc-900/90', 'text-zinc-400');
        } else {
          btn.classList.remove('active', 'border-red-500', 'bg-red-950/80', 'text-white');
          btn.classList.add('border-zinc-800', 'bg-zinc-900/90', 'text-zinc-400');
        }
      });

      if (formsData[formKey]) {
        formNameEl.textContent = formsData[formKey].name;
        formSubEl.textContent = formsData[formKey].sub;
      }

      // Flash & sound
      triggerSurge(true);
    }

    formButtons.forEach(btn => {
      btn.addEventListener('click', () => switchForm(btn.dataset.form));
    });

    // Speed Controls
    const speedButtons = document.querySelectorAll('.speed-btn');
    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => {
          b.classList.remove('active', 'bg-red-900/80', 'text-white', 'border', 'border-red-600');
          b.classList.add('bg-zinc-800/80', 'text-zinc-300');
        });
        btn.classList.add('active', 'bg-red-900/80', 'text-white', 'border', 'border-red-600');
        btn.classList.remove('bg-zinc-800/80', 'text-zinc-300');
        
        currentSpeed = btn.dataset.speed;
        applySpeed(currentSpeed);
        playChakraSound('speed');
      });
    });

    function applySpeed(speed) {
      rollingLayer.style.setProperty('--spin-speed', speed);
    }
    applySpeed(currentSpeed);

    // Direction Toggle
    dirBtn.addEventListener('click', () => {
      isClockwise = !isClockwise;
      if (isClockwise) {
        rollingLayer.classList.remove('rolling-ccw');
        dirBtn.innerHTML = '<span id="dir-icon">↻</span> CW';
      } else {
        rollingLayer.classList.add('rolling-ccw');
        dirBtn.innerHTML = '<span id="dir-icon">↺</span> CCW';
      }
      playChakraSound('speed');
    });

    // Chakra Surge (Speed burst + Flash)
    function triggerSurge(silent = false) {
      if (isSurging) return;
      isSurging = true;

      if (!silent) playChakraSound('activate');

      sharinganSvg.classList.add('flashing');
      applySpeed('0.35s');

      setTimeout(() => {
        sharinganSvg.classList.remove('flashing');
        applySpeed(currentSpeed);
        isSurging = false;
      }, 1400);
    }

    eyeContainer.addEventListener('click', () => triggerSurge());
    surgeBtn.addEventListener('click', () => triggerSurge());
  </script>
</body>
</html>
